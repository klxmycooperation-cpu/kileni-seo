services:
  web:
    image: kileni-web:local
    build:
      context: .
      target: web
      args:
        PRELAUNCH_MODE: "${PRELAUNCH_MODE:-false}"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_PATH: /data/kileni.sqlite
      PRIVATE_UPLOADS_PATH: /data/uploads
      BACKUP_PATH: /data/backups
      HEALTH_REQUIRE_WORKER: "false"
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-3000}:3000"
    volumes:
      - kileni_data:/data
    init: true
    restart: unless-stopped
    stop_signal: SIGTERM
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then((response)=>{if(!response.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  worker:
    image: kileni-worker:local
    build:
      context: .
      target: worker
      args:
        PRELAUNCH_MODE: "${PRELAUNCH_MODE:-false}"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_PATH: /data/kileni.sqlite
      PRIVATE_UPLOADS_PATH: /data/uploads
      BACKUP_PATH: /data/backups
    volumes:
      - kileni_data:/data
    init: true
    restart: unless-stopped
    stop_signal: SIGTERM
    stop_grace_period: 45s
    security_opt:
      - no-new-privileges:true
    depends_on:
      web:
        condition: service_healthy

volumes:
  kileni_data:
